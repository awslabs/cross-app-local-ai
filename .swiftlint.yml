included:
  - Sources
  - Views
  - FastLang
  - Tests

excluded:
  - scratch
  - DerivedData
  - .build
  - Tools
  - Sources/Models/KokoroTTS
  - Tests/IntegrationTests/TTS

analyzer_rules:
  - unused_import

disabled_rules:
  - todo
  - trailing_comma
  - redundant_discardable_let
  - large_tuple

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

force_unwrapping:
  severity: error

implicitly_unwrapped_optional:
  severity: error

line_length:
  warning: 240
  error: 300
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 500
  error: 700

file_length:
  warning: 1500
  error: 2000

function_body_length:
  warning: 100
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 30

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length: 2
  max_length: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k
    - l
    - m
    - n
    - p
    - s
    - v
    - w
    - a
    - b
    - c
    - ok

nesting:
  type_level: 3
  function_level: 3
